# ============================================================================
# Development stack
#
# 환경변수 규칙:
#   - env_file: .env 는 시크릿(JWT_* 등)이 필요한 ssurak 서비스에만 건다.
#     나머지 서비스는 필요한 변수만 environment: 로 명시한다.
# ============================================================================

name: ssurak-dev

services:
  # MySQL Database for development
  mysql:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: ssurak-dev-mysql
    restart: unless-stopped
    command:
      # 개발용: 내구성보다 속도 우선 (운영 설정은 docker-compose.yml 참고)
      - --skip-log-bin
      - --sync_binlog=0
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_temp_data_file_path=ibtmp1:64M:autoextend:max:512M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - ssurak-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.0-alpine
    container_name: ssurak-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ssurak-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend (ssurak-api) - Development
  ssurak:
    image: ssurak-api-dev
    build:
      context: .
      dockerfile: ssurak-api/Dockerfile
      target: development
    container_name: ssurak-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
      REDIS_HOST: redis
      # dev 프론트는 호스트에서 실행되므로 CORS 오리진은 localhost 고정
      ORDER_APP_URL: http://localhost:3000
      CONSOLE_APP_URL: http://localhost:3001
      # 아래 볼륨으로 마운트한 전용 자격증명 디렉토리에서 쓸 프로필을 지정한다.
      # .env가 아니라 여기 둔다 — compose의 environment는 프로세스 시작 전에
      # 실제 환경변수로 박히지만, .env는 ConfigModule이 읽는 시점에 의존해서
      # SDK 기본 체인이 못 볼 수 있다.
      AWS_PROFILE: ssurak-dev
    ports:
      - "127.0.0.1:${SERVER_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ssurak-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/ssurak-api/node_modules
      - /app/db/node_modules
      - /app/packages/schema/node_modules
      # ssurak-dev 프로필 하나만 담은 전용 디렉토리를 읽기 전용으로 빌려준다.
      # 전체 ~/.aws 를 마운트하면 컨테이너 침해 시 다른 프로필 자격증명까지
      # 새어나가므로, 이 서비스 몫만 격리해 최소 권한으로 넘긴다.
      # 이미지에 키를 굽지 않으려는 것이므로 :ro 를 떼지 말 것. dev 타깃은 USER
      # 지정이 없어 root 로 돌기 때문에 마운트 지점이 /root/.aws 다.
      # 준비(호스트에서 1회):
      #   mkdir -p ~/.aws-ssurak-dev
      #   # ~/.aws-ssurak-dev/credentials → [ssurak-dev] 자격증명만
      #   # ~/.aws-ssurak-dev/config      → [profile ssurak-dev] region 등
      - ~/.aws-ssurak-dev:/root/.aws:ro
    # JWT_*, REDIS_PASSWORD 등 시크릿 주입 (environment: 값이 우선 적용됨)
    env_file:
      - .env

  # Prisma Studio - Database GUI
  prisma-studio:
    build:
      context: .
      dockerfile: db/studio.Dockerfile
      target: studio
    container_name: ssurak-prisma-studio
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ssurak-network

networks:
  ssurak-network:
    driver: bridge

volumes:
  mysql_dev_data:
    driver: local
  redis_data:
    driver: local
